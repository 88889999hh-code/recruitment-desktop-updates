name: Publish verified installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in major.minor.patch form
        required: true
      sha256:
        description: Expected installer SHA-256
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify installer
        env:
          VERSION: ${{ inputs.version }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SHA256" =~ ^[a-f0-9]{64}$ ]]
          cat "chunks/v${VERSION}.part-"* > "Recruitment-Setup-${VERSION}.exe"
          echo "$SHA256  Recruitment-Setup-${VERSION}.exe" | sha256sum -c -
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v${VERSION}" "Recruitment-Setup-${VERSION}.exe" --clobber
