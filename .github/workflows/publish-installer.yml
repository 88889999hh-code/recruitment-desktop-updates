name: Publish verified installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify installer
        run: |
          cat chunks/v0.1.5.part-* > Recruitment-Setup-0.1.5.exe
          echo '3bfab52fbf29df6830ca124371fad3ca96a1112c128dfc7b730c60794dc05bb1  Recruitment-Setup-0.1.5.exe' | sha256sum -c -
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.5 Recruitment-Setup-0.1.5.exe --clobber
