name: Build HRBOSS public-login Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - codex/hrboss-public-login
    paths:
      - 'hrboss_app/**'
      - '.github/workflows/build-hrboss-public.yml'

permissions:
  contents: read

jobs:
  windows-exe:
    permissions:
      contents: write # Needed only for the explicit test-only GitHub prerelease asset
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify public-login source excludes restricted driver
        shell: pwsh
        run: |
          $restricted = Select-String -Path hrboss_app/*.py -Pattern '^\s*(from|import)\s+DrissionPage\b|--remote-allow-origins|--remote-debugging-port'
          if ($restricted) { throw 'Restricted browser driver or debugging flag present' }
      - name: Test safe HRBOSS derivative
        shell: pwsh
        env:
          PYTHONPATH: hrboss_app
        run: python -m unittest discover -s hrboss_app/tests -v
      - name: Install build tool only
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3
      - name: Build standalone EXE with embedded Python
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name Recruitment-HRBOSS-Public-Login
          --paths hrboss_app
          --hidden-import ai_panel --hidden-import ai_config
          --hidden-import chat_ai_engine --hidden-import knowledge_base
          --hidden-import conversation_store --hidden-import safety
          --hidden-import draft_ui --hidden-import draft_assistant
          --hidden-import deepseek_client --hidden-import rate_limiter
          --add-data "hrboss_app/LICENSE-HRBOSS-MIT.txt;."
          hrboss_app/boss_recruiter.py
      - name: Smoke launch actual Windows EXE without browser or network
        shell: pwsh
        run: |
          $env:HRBOSS_SELFTEST_RECEIPT = "$pwd/dist/selftest.txt"
          $process = Start-Process -FilePath "$pwd/dist/Recruitment-HRBOSS-Public-Login.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:HRBOSS_SELFTEST_RECEIPT) { Get-Content $env:HRBOSS_SELFTEST_RECEIPT }
            throw "EXE self-test exited $($process.ExitCode)"
          }
          if (!(Test-Path $env:HRBOSS_SELFTEST_RECEIPT)) { throw 'EXE self-test receipt missing' }
          if ((Get-Content $env:HRBOSS_SELFTEST_RECEIPT -Raw).Trim() -ne 'HRBOSS_PUBLIC_LOGIN_SAFE_OK') {
            throw 'EXE self-test receipt invalid'
          }
      - name: Record installer hash and size
        shell: pwsh
        run: |
          $exe = 'dist/Recruitment-HRBOSS-Public-Login.exe'
          if (!(Test-Path $exe)) { throw 'Windows EXE missing' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $exe).Length
          "$hash  Recruitment-HRBOSS-Public-Login.exe" | Set-Content dist/SHA256SUMS.txt
          "SIZE_BYTES=$size"
          "SHA256=$hash"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hrboss-public-login-windows
          path: |
            dist/Recruitment-HRBOSS-Public-Login.exe
            dist/SHA256SUMS.txt
            hrboss_app/LICENSE-HRBOSS-MIT.txt
          retention-days: 1
      - name: Publish test-only Windows EXE for direct download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'hrboss-public-login-draft-test-20261018'
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release tag already exists; manual version change required: $tag"
          }
          gh release create $tag `
            'dist/Recruitment-HRBOSS-Public-Login.exe' `
            'dist/SHA256SUMS.txt' `
            'hrboss_app/LICENSE-HRBOSS-MIT.txt' `
            --target "$env:GITHUB_SHA" `
            --title 'HRBOSS QR Login + Local Draft | TEST ONLY' `
            --notes 'Safe candidate only: official BOSS QR login page and offline synthetic draft rehearsal. Does not read or send any real candidate messages. Not a full automatic recruiter. Production use requires platform authorization and real Windows validation.' `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub test-only release upload failed' }
